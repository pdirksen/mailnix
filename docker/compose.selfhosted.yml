# Self-hosted mailnix: one container (API + web UI + mailbox workers) with SQLite on a volume.
#
#   mkdir -p docker/secrets && openssl rand -base64 32 > docker/secrets/mailnix_master_key   # once; back it up
#   docker compose -f docker/compose.selfhosted.yml up -d --build
#
# Then open http://localhost:8080. Without a bootstrap admin, the first account you register becomes admin; it needs
# the setup code from `docker compose logs mailnix`.
# The port is only published on this machine. Put a TLS-terminating reverse proxy in front for anything beyond it
# (see MAILNIX_TRUSTED_PROXIES below), or set MAILNIX_BIND_ADDRESS=0.0.0.0 for plain HTTP in a trusted network.

services:
  mailnix:
    build:
      context: ..
      dockerfile: docker/Dockerfile
    image: mailnix:latest
    restart: unless-stopped
    ports:
      - "${MAILNIX_BIND_ADDRESS:-127.0.0.1}:8080:8080"
    volumes:
      - mailnix-data:/data
    # Encrypts the keys that protect stored mailbox passwords; kept outside the data volume (see README).
    secrets:
      - mailnix_master_key
    environment:
      Mailnix__DataProtection__MasterKeyFile: /run/secrets/mailnix_master_key
      Mailnix__Mode: AllInOne
      # Further users join by invitation (Admin > Team); true lets anyone who reaches the server sign up.
      Mailnix__Auth__AllowRegistration: ${MAILNIX_ALLOW_REGISTRATION:-false}
      Mailnix__Bootstrap__AdminEmail: ${MAILNIX_ADMIN_EMAIL:-}
      Mailnix__Bootstrap__AdminPassword: ${MAILNIX_ADMIN_PASSWORD:-}
      # Behind a reverse proxy: its address (or network), whose X-Forwarded-* headers are trusted, so cookies are marked
      # Secure on HTTPS and rate limits see the client's address. On the same host via Docker, e.g. 172.16.0.0/12.
      Mailnix__TrustedProxies: ${MAILNIX_TRUSTED_PROXIES:-}
      # Allow plain-text IMAP (not recommended):
      # Mailnix__Mail__AllowInsecureConnections: "true"
      # Email for "forgot password", invitations and security notices (see README):
      # Mailnix__PublicUrl: https://mail.example.com
      # Mailnix__Email__Host: smtp.example.com
      # Mailnix__Email__Username: mailnix@example.com
      # Mailnix__Email__Password: change-me
      # Mailnix__Email__FromAddress: mailnix@example.com
      # PostgreSQL instead of SQLite:
      # Mailnix__Database__Provider: Postgres
      # Mailnix__Database__ConnectionString: Host=postgres;Database=mailnix;Username=mailnix;Password=change-me

volumes:
  mailnix-data:

secrets:
  mailnix_master_key:
    # Create it once: openssl rand -base64 32 > docker/secrets/mailnix_master_key
    file: ./secrets/mailnix_master_key
